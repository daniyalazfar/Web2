<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards Resumidos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="acessibilidade-cores">
        <button type="button" onclick="mudarCor('')">Padrão</button>
        <button type="button" onclick="mudarCor('protanopia')">Protanopia</button>
        <button type="button" onclick="mudarCor('deuteranopia')">Deuteranopia</button>
        <button type="button" onclick="mudarCor('tritanopia')">Tritanopia</button>
    </div>
    <hr>
    
    <div id="menu">
        <h1>Escolha um Tema</h1>
        <h3>Trabalho IFA</h3>
        <button type="button" onclick="escolherTema('Fisica')">Física e Tecnociência</button>
        <button type="button" onclick="escolherTema('Programacao')">Programação</button>
        <button type="button" onclick="escolherTema('Robotica')">Robótica</button>
        
        <h3>Temas Divertidos</h3>
        <button type="button" onclick="escolherTema('Sociedade')">Coisas Gerais</button>
        
        <h3>Muito Difíceis</h3>
        <button type="button" onclick="escolherTema('Dificeis')">Perguntas Difíceis</button>
    </div>

    <div id="estudo" style="display:none;">
        <button type="button" onclick="mudarTamanho(0.1)">+ Tamanho</button>
        <button type="button" onclick="mudarTamanho(-0.1)">- Tamanho</button>
        <button type="button" onclick="lerTexto()">Ouvir</button>
        <button type="button" onclick="voltarMenu()">Sair</button>

        <div id="cartao">
            <h2 id="titulo-cartao"></h2>
            <p id="texto-cartao"></p>
        </div>

        <button type="button" onclick="virar()">Virar Cartão</button><br><br>

        <button type="button" onclick="mudarCartao(-1)">Anterior</button>
        <span id="contador"></span>
        <button type="button" onclick="mudarCartao(1)">Próximo</button>
    </div>

    <script src="main.js"></script>
    
    
    
    
    
    
    
    
    
    
    
    
    Daniyal, Issac
</body>
</html>
