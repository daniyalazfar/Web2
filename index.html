<!DOCTYPE html>
<html>
<head>
    <title>Flashcards Resumidos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="acessibilidade-cores">
        <button onclick="mudarCor('')">Padrão</button>
        <button onclick="mudarCor('protanopia')">Protanopia</button>
        <button onclick="mudarCor('deuteranopia')">Deuteranopia</button>
        <button onclick="mudarCor('tritanopia')">Tritanopia</button>
    </div>
    <hr>
    
    <div id="menu">
        <h1>Escolha um Tema</h1>
        <h3>Trabalho IFA</h3>
        <button onclick="escolherTema('Fisica')">Física e Tecnociência</button>
        <button onclick="escolherTema('Programacao')">Programação</button>
        <button onclick="escolherTema('Robotica')">Robótica</button>
        
        <h3>Temas Divertidos</h3>
        <button onclick="escolherTema('Sociedade')">Coisas Gerais</button>
        
        <h3>Muito Difíceis</h3>
        <button onclick="escolherTema('Dificeis')">Perguntas Difíceis</button>
    </div>

    <div id="estudo" style="display:none;">
        <!-- Agora usamos 0.1 para aumentar 10% do tamanho total de tudo -->
        <button onclick="mudarTamanho(0.1)">+ Tamanho</button>
        <button onclick="mudarTamanho(-0.1)">- Tamanho</button>
        <button onclick="lerTexto()">Ouvir</button>
        <button onclick="voltarMenu()">Sair</button>

        <div id="cartao">
            <h2 id="titulo-cartao"></h2>
            <p id="texto-cartao"></p>
        </div>

        <button onclick="virar()">Virar Cartão</button><br><br>

        <button onclick="mudarCartao(-1)">Anterior</button>
        <span id="contador"></span>
        <button onclick="mudarCartao(1)">Próximo</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
